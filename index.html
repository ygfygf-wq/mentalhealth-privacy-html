<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>プライバシーポリシー</title>
  <meta name="description" content="プライバシーポリシーです。" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f6f3ec;
      --surface: #ffffff;
      --surface-2: #efeae0;
      --ink: #201c2e;
      --sub: #6b6577;
      --faint: #9b96a6;
      --border: #e4ddcf;
      --accent: #4a3aad;
      --accent-soft: #ece8fb;
      --good: #2f7d63;
      --good-soft: #e4f1ea;
      --warn: #a8622a;
      --warn-soft: #f5e9dc;
      --shadow: rgba(40, 30, 10, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17151f;
        --surface: #1e1b29;
        --surface-2: #252132;
        --ink: #ece8f4;
        --sub: #a49dbb;
        --faint: #726c88;
        --border: #322c44;
        --accent: #a89af7;
        --accent-soft: #2b2444;
        --good: #7fd4b2;
        --good-soft: #1c332b;
        --warn: #e0a468;
        --warn-soft: #3a2b1c;
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }

    * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-weight: 400;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: var(--accent); }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* ─── MASTHEAD ─── */
    .masthead {
      max-width: 760px;
      margin: 0 auto;
      padding: 76px 24px 40px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.14em;
      color: var(--accent);
      margin-bottom: 22px;
    }

    .kicker::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .masthead h1 {
      font-family: 'Shippori Mincho', serif;
      font-weight: 700;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: 0.02em;
      line-height: 1.3;
      margin-bottom: 18px;
      text-wrap: balance;
    }

    .masthead .dek {
      max-width: 46em;
      color: var(--sub);
      font-size: 15px;
      line-height: 1.85;
      margin-bottom: 30px;
    }

    .masthead .dek strong { color: var(--ink); font-weight: 500; }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 26px;
      border-top: 1px solid var(--border);
    }

    .updated {
      font-size: 12.5px;
      color: var(--faint);
      display: flex;
      gap: 8px;
      align-items: baseline;
    }

    .updated strong {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      color: var(--sub);
      font-size: 12.5px;
    }

    /* ─── LANG TOGGLE ─── */
    .lang-bar {
      display: inline-flex;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--sub);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 6px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .lang-btn.active {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 3px var(--shadow);
    }

    /* ─── LAYOUT ─── */
    .layout {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 100px;
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      gap: 44px;
      align-items: start;
    }

    .layout > * { min-width: 0; }

    /* ─── TOC ─── */
    .toc {
      position: sticky;
      top: 28px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toc a {
      display: flex;
      align-items: baseline;
      gap: 9px;
      text-decoration: none;
      color: var(--faint);
      font-size: 12.5px;
      padding: 7px 0;
      border-left: 2px solid transparent;
      padding-left: 12px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .toc a:hover { color: var(--ink); }

    .toc a .num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      opacity: 0.7;
    }

    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; padding-top: 4px; }

      .toc {
        position: sticky;
        top: 0;
        z-index: 5;
        flex-direction: row;
        overflow-x: auto;
        gap: 6px;
        background: var(--bg);
        padding: 12px 0 14px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 8px;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .toc::-webkit-scrollbar { display: none; }

      .toc a {
        flex: 0 0 auto;
        border-left: none;
        padding-left: 0;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
      }
    }

    /* ─── SECTION ─── */
    .section {
      padding: 30px 0;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 90px;
    }

    .section:last-child { border-bottom: none; }

    .sec-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 16px;
    }

    .sec-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .sec-header h2 {
      font-family: 'Shippori Mincho', serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 0.01em;
      color: var(--ink);
    }

    /* ─── BODY TEXT ─── */
    .sec-body {
      font-size: 14.5px;
      color: var(--sub);
      line-height: 1.95;
      padding-left: 30px;
    }

    .sec-body p { margin-bottom: 12px; }
    .sec-body p:last-child { margin-bottom: 0; }
    .sec-body strong { color: var(--ink); font-weight: 500; }

    @media (max-width: 480px) {
      .sec-body { padding-left: 0; }
    }

    /* ─── HIGHLIGHT ─── */
    .highlight {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 14px 18px;
      margin-top: 14px;
      font-size: 13.5px;
    }

    .highlight p { color: var(--ink); }

    /* ─── AD TABLE ─── */
    .table-wrap {
      margin-top: 16px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table.ad-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 13.5px;
    }

    .ad-table thead th {
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 500;
      padding: 11px 16px;
      background: var(--surface-2);
    }

    .ad-table thead th:last-child { width: 92px; }

    .ad-table tbody td {
      padding: 11px 16px;
      border-top: 1px solid var(--border);
      color: var(--ink);
      overflow-wrap: break-word;
    }

    @media (max-width: 400px) {
      .ad-table { font-size: 12.5px; }
      .ad-table thead th, .ad-table tbody td { padding: 9px 10px; }
      .ad-table thead th:last-child { width: 78px; }
    }

    .ad-table tbody tr:nth-child(even) td { background: var(--surface-2); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      font-weight: 500;
    }

    .status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status.on { color: var(--warn); }
    .status.on .dot { background: var(--warn); }
    .status.off { color: var(--good); }
    .status.off .dot { background: var(--good); }

    /* ─── FOOTER ─── */
    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 36px 24px 60px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--faint);
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: space-between;
    }

    footer .brand {
      font-family: 'Shippori Mincho', serif;
      color: var(--sub);
    }
  </style>
</head>
<body>

  <header class="masthead">
    <span class="kicker">PRIVACY POLICY</span>
    <h1 id="hero-title">プライバシーポリシー</h1>
    <p class="dek" id="hero-dek">iOSアプリに共通で適用される、データの取り扱いに関する方針です。</p>

    <div class="meta-row">
      <span class="updated"><span id="label-updated">最終更新日</span><strong class="mono">2026/09/22</strong></span>
      <div class="lang-bar">
        <button class="lang-btn active" onclick="setLang('ja')" id="btn-ja">日本語</button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">English</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="toc" id="toc"></nav>
    <main id="policy-content"></main>
  </div>

  <footer>
    <span class="brand">プライバシーポリシー</span>
    <span id="footer-contact-full">ご不明な点は、各アプリ内の「お問い合わせ」フォームよりご連絡ください。</span>
  </footer>

  <script>
    const appAdStatus = [
      { ja: "心と体の記録", en: "Mental Health Tracker", ads: true },
      { ja: "ScheduleMemo", en: "ScheduleMemo", ads: true },
      { ja: "DotArt", en: "DotArt", ads: true },
      { ja: "StudyTimer", en: "StudyTimer", ads: true },
      { ja: "CoupleBudgets", en: "CoupleBudgets", ads: true },
      { ja: "ご機嫌手帳 - 気分とストレスの記録", en: "Gokigen Notebook - Mood & Stress Log", ads: false },
      { ja: "ゆる野菜栽培", en: "Yuru Vegetable Garden", ads: true },
      { ja: "滅 -ストレス解消", en: "Metsu - Stress Relief", ads: true },
      { ja: "Gain Quest - 増量RPG", en: "Gain Quest - Weight Gain RPG", ads: false }
    ];

    function renderAppTable(lang) {
      const onLabel = lang === 'ja' ? '広告あり' : 'Has ads';
      const offLabel = lang === 'ja' ? '広告なし' : 'No ads';
      const appHeader = lang === 'ja' ? 'アプリ' : 'App';
      const statusHeader = lang === 'ja' ? '広告' : 'Ads';
      const rows = appAdStatus.map(app => `
        <tr>
          <td>${app[lang]}</td>
          <td><span class="status ${app.ads ? 'on' : 'off'}"><span class="dot"></span>${app.ads ? onLabel : offLabel}</span></td>
        </tr>`).join('');
      return `<div class="table-wrap"><table class="ad-table">
        <thead><tr><th>${appHeader}</th><th>${statusHeader}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    }

    // slugs stay fixed across languages so anchors/TOC don't break on toggle
    const slugs = ['intro', 'data-collected', 'storage', 'ads', 'changes', 'contact'];

    const sections = {
      ja: [
        {
          title: "はじめに",
          content: `<p>本プライバシーポリシーは、「心と体の記録」「ScheduleMemo」、「DotArt」、「StudyTimer」、「CoupleBudgets」、「ご機嫌手帳 - 気分とストレスの記録」、「ゆる野菜栽培」、「滅 -ストレス解消」、「Gain Quest - 増量RPG」アプリ（以下「本アプリ」）における個人情報・データの取り扱いについて説明するものです。</p>
          <p>本アプリをご利用いただくことで、本ポリシーへ同意いただいたものとみなします。</p>`
        },
        {
          title: "収集する情報",
          content: `<p>各アプリで保存されるのは、体重・気分・学習時間・スケジュール・お小遣い帳の金額など、お客様ご自身が入力した記録データのみです。</p>
          <div class="highlight">
            <p><strong>氏名・メールアドレス・電話番号・位置情報など、個人を特定できる情報を取得することはありません。</strong></p>
          </div>`
        },
        {
          title: "データの保存場所と管理",
          content: `<p>すべての記録データはお使いのiOSデバイスのローカルストレージに保存されます。外部サーバーへの送信やクラウドへのアップロードは行いません。</p>
          <p>アプリを削除すると、保存されたすべてのデータも削除されます。データのバックアップや移行機能は現在提供しておりません。</p>`
        },
        {
          title: "広告・トラッキング",
          content: `<p>本アプリ群は複数の独立したアプリで構成されており、広告表示の有無はアプリによって異なります。実態は以下の通りです。</p>
          ${renderAppTable('ja')}
          <p style="margin-top:16px;">広告を表示するアプリでは、第三者の広告配信サービス（Google AdMob）を利用しています。初回起動時にトラッキングに関する許可（App Tracking Transparency）をリクエストする場合がありますが、許可するかどうかは端末の「設定」からいつでも変更できます。上記以外の独自の行動トラッキングや解析ツールは使用していません。</p>`
        },
        {
          title: "ポリシーの変更について",
          content: `<p>機能追加や法令への対応のため、本ポリシーを改定する場合があります。</p>
          <p>改定後は本ページおよびアプリ内にてお知らせします。改定後も引き続き本アプリをご利用いただいた場合、改定後のポリシーへの同意とみなします。</p>
          <div class="highlight">
            <p>将来的な機能追加に伴い、収集するデータの種類が変わる可能性があります。その際は本ポリシーを更新してお知らせします。</p>
          </div>`
        },
        {
          title: "お問い合わせ",
          content: `<p>本プライバシーポリシーに関するご質問・ご不明な点は、各アプリ内設定画面の「お問い合わせ」フォームよりお気軽にご連絡ください。</p>`
        }
      ],
      en: [
        {
          title: "Introduction",
          content: `<p>This Privacy Policy explains how the "Mental Health Tracker", "ScheduleMemo", "DotArt", "StudyTimer", "CoupleBudgets", "Gokigen Notebook - Mood & Stress Log", "Yuru Vegetable Garden", "Metsu - Stress Relief", and "Gain Quest - Weight Gain RPG" apps (the "Apps") handle your personal data.</p>
          <p>By using any of the Apps, you agree to this policy.</p>`
        },
        {
          title: "Information We Collect",
          content: `<p>Each app only stores the records you enter yourself — such as weight, mood, study time, schedule entries, or budget amounts.</p>
          <div class="highlight">
            <p><strong>We do not collect personally identifying information such as your name, email address, phone number, or location.</strong></p>
          </div>`
        },
        {
          title: "Storage & Data Management",
          content: `<p>All records are saved to your iOS device's local storage. Nothing is transmitted to external servers or uploaded to the cloud.</p>
          <p>Deleting an App permanently removes all of its stored data. Backup or data migration features are not currently available.</p>`
        },
        {
          title: "Ads & Tracking",
          content: `<p>This policy covers several independent apps, and whether an app shows ads depends on the app. Here is the current status of each:</p>
          ${renderAppTable('en')}
          <p style="margin-top:16px;">Apps that show ads use a third-party ad service (Google AdMob). On first launch, such apps may request App Tracking Transparency permission; you can change this at any time in your device's Settings. Aside from this, we do not use any independent behavioral tracking or analytics tools.</p>`
        },
        {
          title: "Policy Updates",
          content: `<p>We may update this policy as new features are added or to comply with applicable laws.</p>
          <p>Updates will be announced on this page and within the Apps. Continued use of an App after changes constitutes acceptance of the revised policy.</p>
          <div class="highlight">
            <p>As new features are introduced, the types of data collected may change. This policy will be updated accordingly.</p>
          </div>`
        },
        {
          title: "Contact",
          content: `<p>For questions about this Privacy Policy, please use the Contact form in each App's Settings screen.</p>`
        }
      ]
    };

    const ui = {
      ja: {
        heroTitle: "プライバシーポリシー",
        heroDek: "個人開発の9つのiOSアプリに共通で適用される、データの取り扱いに関する方針です。",
        labelUpdated: "最終更新日",
        footerContactFull: "ご不明な点は、各アプリ内の「お問い合わせ」フォームよりご連絡ください。"
      },
      en: {
        heroTitle: "Privacy Policy",
        heroDek: "A shared data policy covering nine independently developed iOS apps.",
        labelUpdated: "Last updated",
        footerContactFull: "For questions, please use the Contact form inside each app."
      }
    };

    let currentLang = 'ja';

    function render() {
      const t = ui[currentLang];
      document.getElementById('hero-title').textContent = t.heroTitle;
      document.getElementById('hero-dek').textContent = t.heroDek;
      document.getElementById('label-updated').textContent = t.labelUpdated;
      document.getElementById('footer-contact-full').textContent = t.footerContactFull;
      document.getElementById('btn-ja').classList.toggle('active', currentLang === 'ja');
      document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');
      document.documentElement.lang = currentLang;

      const toc = document.getElementById('toc');
      toc.innerHTML = sections[currentLang].map((sec, i) => `
        <a href="#${slugs[i]}"><span class="num mono">${String(i + 1).padStart(2, '0')}</span>${sec.title}</a>`).join('');

      const container = document.getElementById('policy-content');
      container.innerHTML = sections[currentLang].map((sec, i) => `
        <section class="section" id="${slugs[i]}">
          <div class="sec-header">
            <span class="sec-num mono">${String(i + 1).padStart(2, '0')}</span>
            <h2>${sec.title}</h2>
          </div>
          <div class="sec-body">${sec.content}</div>
        </section>`).join('');
    }

    function setLang(lang) {
      currentLang = lang;
      render();
    }

    render();
  </script>
</body>
</html>
